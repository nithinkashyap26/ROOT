<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question For You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            position: relative;
        }

        /* Floating hearts background */
        .floating-heart {
            position: fixed;
            color: rgba(244, 67, 54, 0.15);
            font-size: 24px;
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main card */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: cardAppear 1s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .big-heart {
            font-size: 80px;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        .question {
            font-size: 32px;
            color: #c2185b;
            margin-bottom: 40px;
            line-height: 1.4;
            font-weight: bold;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        .btn-yes {
            padding: 16px 48px;
            font-size: 22px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #e91e63, #c2185b);
            color: white;
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.6);
        }

        .btn-no {
            padding: 16px 48px;
            font-size: 22px;
            border: 2px solid #ccc;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s ease;
            background: white;
            color: #999;
            position: absolute;
        }

        .btn-no:hover {
            background: #f5f5f5;
        }

        /* Celebration overlay */
        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
        }

        .celebration.active {
            display: flex;
        }

        .congrats-card {
            background: white;
            border-radius: 30px;
            padding: 60px 70px;
            text-align: center;
            animation: congratsAppear 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            z-index: 101;
            position: relative;
        }

        @keyframes congratsAppear {
            from {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .congrats-text {
            font-size: 42px;
            color: #c2185b;
            font-weight: bold;
            margin-bottom: 20px;
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { color: #c2185b; }
            33% { color: #e91e63; }
            66% { color: #ff5252; }
        }

        .congrats-subtext {
            font-size: 24px;
            color: #e91e63;
            margin-top: 10px;
        }

        .congrats-hearts {
            font-size: 50px;
            margin-top: 20px;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
        }

        /* Heart balloon explosion */
        .heart-balloon {
            position: fixed;
            font-size: 40px;
            pointer-events: none;
            z-index: 200;
            animation: balloonRise ease-out forwards;
        }

        @keyframes balloonRise {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.5) rotate(0deg);
            }
            20% {
                opacity: 1;
                transform: translateY(-100px) scale(1.2) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-110vh) scale(1) rotate(20deg);
            }
        }

        /* Sparkle effect */
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            animation: sparkleFade 1.5s ease-out forwards;
        }

        @keyframes sparkleFade {
            0% {
                opacity: 1;
                transform: scale(0) translate(0, 0);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(0) translate(var(--tx), var(--ty));
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 200;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg);
            }
        }

        .hint-text {
            margin-top: 20px;
            font-size: 14px;
            color: #e0a0b0;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .hint-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="card" id="proposalCard">
        <div class="big-heart">&#10084;&#65039;</div>
        <div class="question">Will you be my Valentine?</div>
        <div class="buttons-container" id="buttonsContainer">
            <button class="btn-yes" id="yesBtn" onclick="sayYes()">Yes!</button>
            <button class="btn-no" id="noBtn">No</button>
        </div>
        <div class="hint-text" id="hintText">Hmm... are you sure you want to say no?</div>
    </div>

    <div class="celebration" id="celebration">
        <div class="congrats-card">
            <div class="congrats-text">Congratulations!!!</div>
            <div class="congrats-subtext">I knew you'd say yes!</div>
            <div class="congrats-hearts">&#10084;&#65039;&#127880;&#10084;&#65039;</div>
        </div>
    </div>

    <script>
        // Create floating background hearts
        function createFloatingHearts() {
            const hearts = ['\u2764', '\u2665', '\u2661', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83D\uDC97'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
                heart.style.animationDuration = (Math.random() * 8 + 6) + 's';
                heart.style.animationDelay = (Math.random() * 10) + 's';
                document.body.appendChild(heart);
            }
        }

        createFloatingHearts();

        // No button dodge logic
        const noBtn = document.getElementById('noBtn');
        const hintText = document.getElementById('hintText');
        const container = document.getElementById('buttonsContainer');
        let dodgeCount = 0;

        const hints = [
            "Hmm... are you sure you want to say no?",
            "Think again, sweetheart!",
            "That button seems to be running away...",
            "I think the universe wants you to say Yes!",
            "You can't catch it! Just say Yes!",
            "The No button has left the chat...",
            "Resistance is futile!",
            "Come on... you know you want to say Yes!"
        ];

        function moveNoButton() {
            dodgeCount++;

            // Show hint text
            hintText.textContent = hints[Math.min(dodgeCount - 1, hints.length - 1)];
            hintText.classList.add('visible');

            // Get viewport dimensions with safe margins
            const btnRect = noBtn.getBoundingClientRect();
            const viewportW = window.innerWidth;
            const viewportH = window.innerHeight;
            const margin = 20;

            // Calculate random position anywhere on screen
            const maxX = viewportW - btnRect.width - margin;
            const maxY = viewportH - btnRect.height - margin;
            const randomX = Math.random() * maxX + margin;
            const randomY = Math.random() * maxY + margin;

            // Move button to fixed position on screen
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.zIndex = '50';
            noBtn.style.transition = 'none';

            // Make the yes button grow slightly each time
            const yesBtn = document.getElementById('yesBtn');
            const scale = 1 + dodgeCount * 0.04;
            yesBtn.style.transform = 'scale(' + Math.min(scale, 1.4) + ')';
        }

        // Listen for both mouse hover and touch
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            moveNoButton();
        });

        // Celebration when Yes is clicked
        function sayYes() {
            const celebration = document.getElementById('celebration');
            celebration.classList.add('active');

            // Launch heart balloon explosions
            launchHeartBalloons();

            // Keep launching balloons periodically
            setInterval(launchHeartBalloons, 2000);
            setInterval(launchConfetti, 1500);
        }

        function launchHeartBalloons() {
            const heartEmojis = ['\u2764\uFE0F', '\uD83D\uDC96', '\uD83D\uDC95', '\uD83D\uDC97', '\uD83D\uDC93',
                                 '\uD83D\uDC9E', '\uD83D\uDC9D', '\uD83C\uDF88', '\u2763\uFE0F', '\uD83E\uDE77'];
            const colors = ['#e91e63', '#f44336', '#ff5252', '#ff4081', '#c2185b', '#d81b60'];

            // Create explosion burst from multiple points
            for (let burst = 0; burst < 3; burst++) {
                const originX = Math.random() * window.innerWidth;
                const originY = window.innerHeight + 50;

                for (let i = 0; i < 8; i++) {
                    setTimeout(function() {
                        const balloon = document.createElement('div');
                        balloon.className = 'heart-balloon';
                        balloon.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                        balloon.style.left = (originX + (Math.random() - 0.5) * 200) + 'px';
                        balloon.style.top = originY + 'px';
                        balloon.style.fontSize = (Math.random() * 30 + 30) + 'px';
                        balloon.style.animationDuration = (Math.random() * 3 + 3) + 's';
                        document.body.appendChild(balloon);

                        // Create sparkles around each balloon
                        for (let s = 0; s < 4; s++) {
                            const sparkle = document.createElement('div');
                            sparkle.className = 'sparkle';
                            sparkle.style.left = (originX + (Math.random() - 0.5) * 300) + 'px';
                            sparkle.style.top = (originY - Math.random() * 200) + 'px';
                            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
                            sparkle.style.setProperty('--tx', (Math.random() - 0.5) * 100 + 'px');
                            sparkle.style.setProperty('--ty', (Math.random() - 0.5) * 100 + 'px');
                            document.body.appendChild(sparkle);

                            setTimeout(function() { sparkle.remove(); }, 1500);
                        }

                        setTimeout(function() { balloon.remove(); }, 6000);
                    }, i * 100 + burst * 300);
                }
            }
        }

        function launchConfetti() {
            const colors = ['#e91e63', '#f44336', '#ff5252', '#ff4081',
                           '#ff80ab', '#f8bbd0', '#ffd54f', '#ffab40', '#ab47bc'];
            const shapes = ['circle', 'square'];

            for (let i = 0; i < 30; i++) {
                setTimeout(function() {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = -20 + 'px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)] === 'circle' ? '50%' : '2px';
                    confetti.style.width = (Math.random() * 10 + 6) + 'px';
                    confetti.style.height = (Math.random() * 10 + 6) + 'px';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(function() { confetti.remove(); }, 5000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
